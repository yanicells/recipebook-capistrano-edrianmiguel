{% extends 'base.html' %}

{% block title %}{{ recipe.name }} - Recipe Book{% endblock %}

{% block content %}
<h2>{{ recipe.name }}</h2>
<h3>Ingredients:</h3>
<ul>
    {% for ingredient in recipe.ingredients %}
    <li>{{ ingredient.name }} - {{ ingredient.quantity }}</li>
    {% endfor %}
</ul>
<a href="/recipes/list">Back to Recipe List</a>
{% endblock %}
